<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cedric Bet</title>
</head>

<body>

<h1>⚽ Cedric Bet</h1>

<h2>Login</h2>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

<p>
    Don't have an account?
    <a href="/register">Register</a>
</p>

</body>
</html>
